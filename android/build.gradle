buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["TruVideoReactCameraSdk_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["TruVideoReactCameraSdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TruVideoReactCameraSdk_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.truvideoreactcamerasdk"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // Truvideo SDK
  implementation 'com.github.Truvideo:truvideo-sdk-android-camera:79.2.1'

  // AndroidX & Compose
  implementation 'com.google.android.material:material:1.12.0'
  implementation 'androidx.activity:activity-ktx:1.9.3'
  implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
  implementation platform('androidx.compose:compose-bom:2024.03.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material:material'
  implementation 'androidx.compose.ui:ui-tooling-preview'

  // JSON & Gson
  implementation 'org.json:json:20240303'
  implementation 'com.google.code.gson:gson:2.10.1'

  // Kodein DI
  implementation "org.kodein.di:kodein-di:7.18.0"
  implementation "org.kodein.di:kodein-di-framework-android-x:7.18.0"

  // Multiplatform Settings
  implementation "com.russhwolf:multiplatform-settings:1.0.0"


  // KotlinX DateTime (required for Clock.System)
  implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.6.0"

  // Ktor dependencies (Android)
  implementation "io.ktor:ktor-client-core:2.3.5"
  implementation "io.ktor:ktor-client-okhttp:2.3.5"
  implementation "io.ktor:ktor-client-logging:2.3.5"
  implementation "io.ktor:ktor-client-content-negotiation:2.3.5"
  implementation "io.ktor:ktor-serialization-kotlinx-json:2.3.5"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'

}


